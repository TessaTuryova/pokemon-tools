<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade String Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Pokémon GO – Trade String Generator</h1>
  <div class="input-header">
    <p>Vlož svoj input text:</p>
    <button id="info-button" class="info-btn" onclick="openInfoModal()" title="Ako to funguje">ℹ️</button>
  </div>

  <textarea id="input" placeholder="Sem vlož skopírovaný godex..."></textarea>

  <button id="generate-button" onclick="processData()">Generuj</button>

  <h2>Output:</h2>
  <div class="output-container">
    <textarea id="output" placeholder="Výsledný trade search string sa zobrazí tu..." readonly></textarea>
    <button id="copy-button" onclick="copyToClipboard()" title="Kopírovať do schránky">📋 Kopírovať</button>
  </div>

  <script src="script.js"></script>

  <!-- Info Modal -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeInfoModal()">&times;</span>
      <h2>Ako to funguje:</h2>
      <pre id="infoText"></pre>
    </div>
  </div>
</body>
</html>
